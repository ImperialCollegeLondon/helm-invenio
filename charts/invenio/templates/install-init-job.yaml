{{- if .Values.invenio.init }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "invenio.fullname" . }}-install-init
  labels:
    {{- include "invenio.labels" . | nindent 4 }}
    app: install-init
    module: install
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "1"
{{/*    "helm.sh/hook-delete-policy": hook-succeeded*/}}
  {{- $cmd := "/opt/invenio/src/.venv/bin/invenio db init && /opt/invenio/src/.venv/bin/invenio db create && /opt/invenio/src/.venv/bin/invenio index init && /opt/invenio/src/.venv/bin/invenio index queue init purge && /opt/invenio/src/.venv/bin/invenio files location --default 'default-location'  $(/opt/invenio/src/.venv/bin/invenio shell --no-term-title -c \"print(app.instance_path)\")'/data' && /opt/invenio/src/.venv/bin/invenio roles create admin && /opt/invenio/src/.venv/bin/invenio access allow superuser-access role admin" -}}
{{- range $usr, $pass := .Values.invenio.default_users -}}
  {{- $cmd = printf "%s && /opt/invenio/src/.venv/bin/invenio users create --active --confirm --password=%s %s" $cmd $pass $usr -}}
{{- end -}}
{{- if and .Values.invenio.demo_data .Values.invenio.default_users -}}
  {{- $cmd = cat $cmd "&& /opt/invenio/src/.venv/bin/invenio rdm-records demo" -}}
{{- end -}}
{{- if .Values.invenio.create_fixtures -}}
  {{- $cmd = cat $cmd "&& /opt/invenio/src/.venv/bin/invenio rdm-records fixtures" -}}
{{- end -}}

spec:
  template:
    spec:
      initContainers:
      - name: wait-for-opensearch
        image: busybox
        command: [ "/bin/sh","-c" ]
        args: [ "until echo 'Waiting for opensearch...' && nc -vz -w 5 {{ include "invenio.opensearch.hostname" $ }} 9200; do sleep 10; done;" ]
      containers:
      - name: install-init
        image: {{ default .Values.web.image (include "invenio.image" .) }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        command: [
          "/bin/bash",
          "-c",
          {{ $cmd | quote }}
        ]
        envFrom:
        - configMapRef:
            name: {{ include "invenio.fullname" . }}-config
        - secretRef:
            name: {{ include "invenio.secretName" . }}
        env:
        - name: TZ
          value: {{ required "Missing .Values.global.timezone" .Values.global.timezone }}
        {{- include "invenio.config.queue" . | nindent 8 }}
        {{- include "invenio.config.database" . | nindent 8 }}
        {{- with .Values.invenio.extraEnvVars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
          {{- range $key, $value := .Values.invenio.vocabularies }}
          - name: vocabularies
            mountPath: "/opt/invenio/var/instance/app_data/vocabularies/{{ $key }}"
            subPath: "{{ $key }}"
          {{- end }}
        {{- include "invenio.config.sentry" . | nindent 8 }}
        {{- if .Values.web.resources }}
        resources: {{- toYaml .Values.web.resources | nindent 10 }}
        {{- end }}
      restartPolicy: OnFailure
      {{- if .Values.invenio.vocabularies }}
      volumes:
        - name: vocabularies
          configMap:
            name: "{{ include "invenio.fullname" . }}-vocabularies"
      {{- end }}
      {{- if .Values.web.imagePullSecret }}
      imagePullSecrets:
      - name: {{ .Values.web.imagePullSecret }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
